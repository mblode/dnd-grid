name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Skipped on the Version Packages PR: that PR consumes the changeset and
      # applies the version bumps, so `changeset status` there always reports
      # "packages changed but no changesets found" and fails by construction.
      - name: Changeset Status
        if: github.head_ref != 'changeset-release/main'
        run: npx --no-install changeset status --since origin/main

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check-types

      - name: Test
        run: npm run test

      - name: Dead code
        run: npm run knip

      - name: Build
        run: npm run build

      # Packs both packages and type-checks a consumer against them. The
      # in-repo typecheck resolves @dnd-grid/core through the workspace
      # symlink, so it cannot see a broken published declaration.
      - name: Check published types
        run: node scripts/check-package-types.mjs

      - name: Smoke Test Docs Worker
        run: npm run smoke --workspace=docs-worker

      - name: Smoke Test Docs Proxy
        run: npm run smoke:docs-proxy --workspace=web
